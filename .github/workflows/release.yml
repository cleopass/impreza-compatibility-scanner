name: Release zip

# Push a tag like v0.9.0-beta to build the installable zip and attach it to a GitHub release.
on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build zip with the correct folder name
        run: git archive --format=zip --prefix=impreza-compatibility-scanner/ -o impreza-compatibility-scanner.zip HEAD
      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" impreza-compatibility-scanner.zip \
            --title "$GITHUB_REF_NAME" \
            --notes-file CHANGELOG.md \
            $( [[ "$GITHUB_REF_NAME" == *beta* || "$GITHUB_REF_NAME" == *rc* ]] && echo --prerelease )
